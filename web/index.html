<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuJoCo viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #17191d; color: #eee; font: 14px sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 8px 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    iframe { flex: 1; width: 100%; border: 0; min-height: 0; }
  </style>
  <script type="module" src="input.js"></script>
</head>
<body>
  <header>
    <strong>MuJoCo</strong>
    <span id="connection" role="status">Connecting input…</span>
    <button id="capture" type="button">Capture mouse</button>
    <span>Click the scene to capture; Escape releases.</span>
  </header>
  <iframe id="viewer" src="viewer" title="MuJoCo scene"></iframe>
</body>
</html>
