[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmuc2027-mjarena"
version = "0.1.0"
description = "Composable MuJoCo arenas and browser visualization"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.15", "numpy"]

[project.optional-dependencies]
viewer = ["mjviser>=0.0.14,<0.1", "viser>=1.1,<1.2", "websockets>=15,<17"]

[project.scripts]
arena-sim = "rmuc2027_mjarena.__main__:main"

[tool.setuptools]
packages = ["rmuc2027_mjarena"]

[tool.setuptools.package-data]
rmuc2027_mjarena = ["web/*.html", "web/*.js", "arena_mjcf/*.xml", "arena_mjcf/*.json", "arena_mjcf/*.md", "arena_mjcf/assets/*"]
